<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grill Tracker">
<meta name="theme-color" content="#1b1f27">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Grill Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="pin-overlay" class="overlay">
  <div class="keypad-panel">
    <div class="keypad-header">
      <span class="keypad-emoji">🔒</span>
      <span>PIN eingeben</span>
    </div>
    <div id="pin-display" class="keypad-display pin-display">----</div>
    <div id="pin-error" class="pin-error hidden">Falscher PIN</div>
    <div class="keypad-grid">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key-clear" data-key="clear">C</button>
      <button class="key" data-key="0">0</button>
      <button class="key key-back" data-key="back">⌫</button>
    </div>
  </div>
</div>

<main id="main-screen">
  <div class="buttons">
    <button class="animal-btn hendl" data-type="hendl" data-label="Hendlspieße">
      <span class="emoji">🐔</span>
      <span class="label">Hendlspieße</span>
    </button>
    <button class="animal-btn ente" data-type="ente" data-label="Entenspieße">
      <span class="emoji">🦆</span>
      <span class="label">Entenspieße</span>
    </button>
  </div>

  <section class="summary">
    <div class="summary-card">
      <span class="summary-emoji">🐔</span>
      <span id="total-hendl" class="summary-total">0</span>
      <span class="summary-label">aktuell</span>
    </div>
    <div class="summary-card">
      <span class="summary-emoji">🦆</span>
      <span id="total-ente" class="summary-total">0</span>
      <span class="summary-label">aktuell</span>
    </div>
  </section>

  <button id="graph-open" class="graph-open-btn" aria-label="Grafik anzeigen">📊</button>

  <div id="sync-status" class="sync-status">✓ Synced to Sheet</div>

  <section class="recent">
    <h2>Letzte Einträge</h2>
    <ul id="recent-list"></ul>
  </section>
</main>

<div id="keypad-overlay" class="overlay hidden">
  <div class="keypad-panel">
    <div class="keypad-header">
      <span id="keypad-emoji" class="keypad-emoji"></span>
      <span id="keypad-title">Hendlspieße</span>
    </div>
    <div id="keypad-display" class="keypad-display">0</div>
    <div class="keypad-grid">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key-clear" data-key="clear">C</button>
      <button class="key" data-key="0">0</button>
      <button class="key key-back" data-key="back">⌫</button>
    </div>
    <div class="keypad-actions">
      <button id="keypad-cancel" class="action-btn cancel">Cancel</button>
      <button id="keypad-confirm" class="action-btn confirm">Confirm</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<div id="graph-overlay" class="overlay hidden">
  <div class="graph-panel">
    <div class="graph-header">
      <div class="graph-toggle type-toggle">
        <button class="toggle-btn active" data-graph-type="hendl">🐔 Hendlspieße</button>
        <button class="toggle-btn" data-graph-type="ente">🦆 Entenspieße</button>
      </div>
      <button id="graph-close" class="graph-close" aria-label="Schließen">✕</button>
    </div>
    <div id="graph-source-toggle" class="graph-toggle source-toggle"></div>
    <select id="graph-date-select" class="graph-date-select hidden"></select>
    <div class="graph-canvas-wrap">
      <canvas id="graph-canvas"></canvas>
    </div>
    <div class="graph-legend">
      <span class="legend-item"><span class="legend-swatch actual"></span>Heute</span>
      <span class="legend-item"><span class="legend-swatch reference"></span><span id="legend-reference-label">Durchschnitt (Wochentag)</span></span>
    </div>
    <div id="graph-status" class="graph-status"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
